name: Release

# 只有打 tag（v*）才触发发版；APK 按 ABI 出包（arm64-v8a / armeabi-v7a / x86_64）+ universal 全量包
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Calculate version code from tag (e.g., 1.4.2 -> 10402)
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          echo "versionCode=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> $GITHUB_OUTPUT
          echo "versionName=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run

      - name: Build web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Name APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist-apk
          OUT=android/app/build/outputs/apk/release
          cp "$OUT/app-arm64-v8a-release.apk"   "dist-apk/GagaTimetable-$VERSION-arm64-v8a.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "dist-apk/GagaTimetable-$VERSION-armeabi-v7a.apk"
          cp "$OUT/app-x86_64-release.apk"      "dist-apk/GagaTimetable-$VERSION-x86_64.apk"
          cp "$OUT/app-universal-release.apk"   "dist-apk/GagaTimetable-$VERSION-universal.apk"
          cp "$OUT/app-universal-release.apk"   dist-apk/GagaTimetable-android.apk

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: v${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.versionCode }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="$VERSION" TAG="$TAG" CODE="$CODE" REPO="$REPO" node -e '
            const { execSync } = require("node:child_process");
            const { writeFileSync, statSync, readFileSync } = require("node:fs");
            const { createHash } = require("node:crypto");
            const version = process.env.VERSION, tag = process.env.TAG, code = process.env.CODE, repo = process.env.REPO;
            const abis = ["arm64-v8a", "armeabi-v7a", "x86_64", "universal"];
            const sha256 = (f) => createHash("sha256").update(require("node:fs").readFileSync(f)).digest("hex");
            const row = (abi) => {
              const f = `dist-apk/GagaTimetable-${version}-${abi}.apk`;
              const size = (statSync(f).size / 1048576).toFixed(1);
              return `<tr><td>${abi === "universal" ? "全量（不确定设备选这个）" : abi}</td><td>${size} MB</td><td><code>${sha256(f)}</code></td></tr>`;
            };
            const prev = (() => { try { return execSync(`git describe --tags --abbrev=0 "${tag}^" 2>/dev/null`).toString().trim(); } catch { return ""; } })();
            const log = prev
              ? execSync(`git log --format="- %s (%h)" "${prev}..${tag}"`).toString()
              : execSync(`git log --format="- %s (%h)" "${tag}"`).toString();
            const notes = [
              `<a href="https://github.com/${repo}/releases/download/${tag}/GagaTimetable-${version}-universal.apk"><img src="https://raw.githubusercontent.com/${repo}/main/docs/download-android.svg" alt="Download for Android" /></a>`,
              "",
              "<details>",
              "<summary>APK 信息</summary>",
              "",
              `<table><tr><td>versionCode</td><td>${code}</td></tr></table>`,
              "<table><tr><th>ABI</th><th>大小</th><th>SHA-256</th></tr>",
              ...abis.map(row),
              "</table>",
              "</details>",
              "",
              "### 变更",
              "",
              log,
              prev ? `\n**Full Changelog**: [${prev}...${tag}](https://github.com/${repo}/compare/${prev}...${tag})` : "",
              "",
            ];
            writeFileSync("release-notes.md", notes.join("\n"));
          '

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-apk/GagaTimetable-${{ steps.version.outputs.version }}-arm64-v8a.apk
            dist-apk/GagaTimetable-${{ steps.version.outputs.version }}-armeabi-v7a.apk
            dist-apk/GagaTimetable-${{ steps.version.outputs.version }}-x86_64.apk
            dist-apk/GagaTimetable-${{ steps.version.outputs.version }}-universal.apk
            dist-apk/GagaTimetable-android.apk
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
